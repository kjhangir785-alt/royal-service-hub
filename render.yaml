# Render Blueprint for The Bullet Zone — FastAPI backend
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: the-bullet-zone-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements-prod.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      # --- Fill these in the Render dashboard (Environment tab) ---
      - key: MONGO_URL          # MongoDB Atlas connection string (mongodb+srv://...)
        sync: false
      - key: DB_NAME            # e.g. the_bullet_zone
        sync: false
      - key: ADMIN_EMAIL        # owner login email
        sync: false
      - key: ADMIN_PASSWORD     # owner login password
        sync: false
      - key: CORS_ORIGINS       # your Cloudflare Pages URL, e.g. https://the-bullet-zone.pages.dev
        sync: false
      - key: EMERGENT_LLM_KEY   # only needed for admin image uploads (see DEPLOYMENT.md caveat)
        sync: false
      # JWT_SECRET is auto-generated by Render:
      - key: JWT_SECRET
        generateValue: true
